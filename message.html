<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lời chúc 20/10 💌</title>
  <style>
    :root {
      --accent: #e91e63
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(45deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
      background-size: 400% 400%;
      animation: move 10s linear infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    @keyframes move {
      0% {
        background-position: 0% 50%
      }

      50% {
        background-position: 100% 50%
      }

      100% {
        background-position: 0% 50%
      }
    }

    .container {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 20px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
      width: 92%;
      max-width: 560px;
      position: relative;
      z-index: 1;
      transition: filter .6s ease, opacity .6s ease;
    }

    .container.dimmed {
      filter: blur(6px) brightness(.5)
    }

    input,
    button {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--accent);
      font-size: 16px;
      outline: none;
    }

    button {
      background: var(--accent);
      color: #fff;
      margin-left: 8px;
      cursor: pointer
    }

    .wish-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      opacity: 0;
      transition: opacity .9s ease, transform .6s ease
    }

    .wish-content.show {
      opacity: 1;
      transform: translateY(0)
    }

    .wish-image {
      width: 320px;
      max-width: 88%;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
      transform: scale(.98)
    }

    .wish-text {
      color: var(--accent);
      font-size: 18px;
      line-height: 1.6;
      white-space: pre-line
    }

    #celebration {
      position: fixed;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%) scale(.95);
      font-size: 56px;
      color: #fff;
      text-shadow: 0 6px 30px rgba(233, 30, 99, 0.65);
      z-index: 6;
      opacity: 0;
      transition: all 1.2s ease;
    }

    #celebration.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1)
    }

    #fireworksCanvas {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
      display: none;
      opacity: 1;
      transition: opacity 1.4s ease;
    }

    .heart {
      position: fixed;
      bottom: 0;
      font-size: 26px;
      pointer-events: none;
      z-index: 4;
      animation: fly 6s linear infinite
    }

    @keyframes fly {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1
      }

      100% {
        transform: translateY(-100vh) scale(1.8);
        opacity: 0
      }
    }
  </style>
</head>

<body>
  <canvas id="fireworksCanvas"></canvas>
  <div id="celebration">💖 Chúc mừng 20/10 💐</div>

  <div class="container" id="box">
    <h1>🔒 Nhập mật khẩu để nhận lời chúc 💖</h1>
    <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;">
      <input type="password" id="passInput" placeholder="Nhập mật khẩu của bạn" inputmode="latin" autocapitalize="none"
        autocomplete="off" autocorrect="off" spellcheck="false" />

      <button id="checkBtn">Xác nhận</button>
    </div>
    <div id="result" style="margin-top:12px;color:var(--accent)"></div>
  </div>

  <script>

      "thungan": { text: "💐 Chúc Ngân 20/10 thật vui vẻ, xinh đẹp, luôn cười tươi như hoa.", img: "thungan.jpeg" },
      "hathuong": {

        img: "hathuong.jpeg"
      },
      "haily": {
        text: "💖 Nhân ngày phụ nữ Việt Nam 20/10 mình chúc bạn Hải Ly tràn ngập niềm vui và hạnh phúc , chúc bạn luôn xinh đẹp dịu dàng luôn nở nụ cười trên môi. Mong từ ngày này trở đi bạn luôn nở nụ cười thay vì mít ướt nha luôn tích cực và hoà đồng với mọi người nha",
        img: "haily.jpeg"
      },
      "lananh": {
        text: "Chúc Lanh 20/10 luôn xinh như thiên thần, cười tươi như hoa nở, hạnh phúc như được ngủ thêm 10 tiếng, và lúc nào cũng đáng yêu như bây giờ nhaaa",
        img: "lanh.jpeg"
      },
      "thuyhuong": {
        text: "Nhân dịp 20/10,chúc Hương luôn tươi tắn và hoạt bát, chúc tương lai Hương sáng lạn, dù sẽ có lúc THỊNH lúc suy, song mong hương vẫn luôn tiến lên phía trước",

      "nhuquynh": {
        text: "20/10 chúc Như Quỳnh luôn vui vẻ tươi tắn nở như hoa học giỏi hơn nhiều và luon luon xinh đẹp nha vững bước trên con đường mình chọn nhé",
        img: "nhuquynh.jpeg"
      },
      "dieuchau": {
        text: "Đẹp – có. Cá tính – có. Biết chơi Valorant – quá có! Châu ơi, 20-10 này không ai xứng đáng được tặng skin hơn bạn hết. Chúc bạn rực rỡ như khẩu Vandal Prime và cool như Killjoy bật ulti!",
        img: "chau.jpeg"
      },
      "mailinh": {
        text: "Chúc bạn Mai Linh – cô bạn chăm học nhất lớp – có một ngày 20/10 thật ý nghĩa, luôn tràn đầy năng lượng, gặp nhiều may mắn và giữ vững tinh thần học tập tuyệt vời như hiện tại nha! 💖",
        img: "mailinh.jpeg"
      },
      "baoky": {
        text: "20/10 vui vẻ nhé! Chúc bạn 𝘽ả𝙤 𝙆ỳ luôn rạng rỡ, tự tin và tỏa sáng như đóa hoa giữa cuộc đời. Không những thế chúc bạn có thật nhiều niềm vui, sức khỏe dẻo dai để tiếp tục tung hoành trên sân cầu lông và trong cuộc sống!",
        img: "ky.jpeg"
      },
      "maiquynh": {
        text: "Chúc bạn Mai Quỳnh ngày 20/10 thật vui vẻ và rực rỡ. Chúc Quỳnh luôn luôn xinh đẹp tự tin và luôn giữ được những nụ cười tươi tắn trên môi.",
        img: "maiquynh.jpeg"
      },
      "thuylinh": {
        text: `Gửi Thùy Linh✨,
​Nhân ngày 20/10. Tớ muốn gửi tới cậu lời chúc tốt đẹp nhất.
​Chúc Thùy Linh✨ của lớp mình luôn xinh đẹp, rạng rỡ và giữ mãi nụ cười tươi tắn đó nhé! Quan trọng hơn, chúc cậu luôn học tốt, đạt được mọi mục tiêu mà cậu đặt ra trong năm học này. Mong cậu luôn tràn đầy năng lượng, vui vẻ và có thật nhiều kỷ niệm đáng nhớ bên bạn bè dưới mái trường cấp Ba này.
​Hy vọng cậu có một ngày 20/10 thật ý nghĩa, ấm áp và nhận được nhiều quà!`,
        img: "thuylinh.jpeg"
      },
      "mailan": {
        text: `Chúc mừng 20/11 nhé hoạ sĩ của lớp 
Dù lúc nào cũng “bay trên mây”, vẽ tranh quên cả trời đất, nhưng cậu luôn mang lại tiếng cười và năng lượng tích cực cho cả lớp. Mong rằng nét vẽ của cậu sẽ ngày càng sắc sảo, sáng tạo hơn nữa, và sự hồn nhiên, vui vẻ ấy sẽ luôn theo cậu mãi!
Chúc cậu một ngày 20/11 thật vui, tiếp tục “vô tư” đúng chất, và vẽ ra một tương lai rực rỡ như những bức tranh cậu yêu thích nhé! 🎉♥️`,
        img: "mailan.jpg"
      },
      "khanhlinh": {
        text: `Chúc mừng 20/10, Khánh Linh! 💕🎉
Chúc bạn luôn xinh đẹp, tự tin và rạng rỡ như một đóa hoa. Mong bạn có một ngày thật đặc biệt, tràn đầy niềm vui, hạnh phúc và những bất ngờ thú vị. Bạn xứng đáng được yêu thương và chăm sóc. Chúc bạn có một tương lai tươi sáng và thành công🎁💗`,
        img: "khanhlinh.jpeg"
      },
      "daomy": {
        text: `Gửi 🍑 My 🐳🐳
Nhân ngày Phụ nữ Việt Nam 20/10, chúc bạn 🍑 My --"tân bí thư"-- Cô gái tính khí trẻ con nhưng tốt bụng , hoà đồng với bạn bè --. Mong cổ luôn hạnh phúc,học giỏi,cao hơn bằng bạn bằng bè , mau ăn chóng lớn , luôn tươi cười rạng rỡ, gặp thật nhiều niềm vui trong cuộc sống, Mong không chỉ ngày hôm nay còn nhiều ngày nữa sẽ được những lời chúc tốt đẹp hơn . Và hãy nhớ mình là người phụ nữ đẹp của tổ 2 và lớp 11A7 
Hy vọng cậu sẽ có ngày 20/10 thật vui vẻ và nhận nhiều quà`,
        img: "daomy.jpeg"
      },
      "thutrang": {
        text: "Nhân ngày Phụ nữ Việt Nam 20/10,Thu Trang – cô bạn năng động, dễ thương và luôn mang lại tiếng cười cho mọi người – chúc bạn ngày càng xinh đẹp, tự tin và thành công hơn nữa. Chúc bạn có một ngày 20/10 thật ý nghĩa, được nhận nhiều hoa, quà và lời chúc ngọt ngào nhất! 💖🌸",
        img: "trang.jpeg"
      },
      "ngocphuong": {
        text: "💗 20/10 Chúc Phương ngày càng xinh xắn, dễ thương, không còn lỡ tay đánh bạn bên cạnh:))) và gặp được người yêu, thương mình chiều mình nhaaa",
        img: "ngocphuong.jpeg"
      },
      "phuonganh": {
        text: "(⁠◍⁠•⁠ᴗ⁠•⁠◍⁠)⁠✧⁠*⁠。 Chúc cô gái dễ thương, nhẹ nhàng, xinh xắn, vẽ đẹp có một ngày 20/10 thật vui vẻ. Cuộc đời mà chỉ sống được 1 lần thôi, cứ vui đi, không có gì phải nghĩ lung tung với tiêu cực cả. UwU ",
        img: "phuonganh.jpg"
      },
      "huongly": {
        text: "Chúc HuongLy 20/10 1 ngày vui tươi , xinh đẹp , hạnh phúc , chăm chỉ và học giỏi hơn , tuổi mới rồi thì  mạnh mẽ lên cô nhé Happy Vietnamese Women's Dayybel !!",
        img: "huongly.jpeg"
      },
      "thuclinh": {
        text: `Happy 20/10 cô nàng Thục Linh!
Chúc bà luôn xinh, luôn vui, và biết cất điện thoại đúng lúc để khỏi bị “bay màu” tiết học nha 😆📚`,
        img: "thuclinh.jpeg"
      },
      "duongmy": {
        text: "Happy women's day. Chúc Dtrmy lúc nào có nhiều năng lượng tích cực, nhận được nhiều hạnh phúc trong cuộc sống và mãi là bông hoa  hướng dương luôn hướng về phía ánh sáng.",
        img: "duongmy.jpeg"
      },
      "ngochao": {
        text: `20/10 chúc Hảo càng ngày càng xinh,
học càng ngày càng đỉnh,
và lướt điện thoại trong giờ mà không bị tóm càng ngày càng chuyên nghiệp hơn 😏
Idol “đa nhiệm” của lớp là đây chứ đâu!`,
        img: "ngochao.jpeg"
      },
      "khanhly": {
        text: `Chúc bạn khánh Ly có một ngày 20/10 thật đặc biệt và tràn đầy yêu thương.
Chúc bạn luôn tươi tắn, học tốt và gặp thật nhiều điều may mắn.
Mong rằng mỗi ngày đến lớp đều là một ngày vui với bạn và cả chúng mình 💖`,
        img: "khanhly.jpg"
      },
      "tranly": {
        text: "Ly à, nhân địp 20/10, chúc ly thật vui vẻ và hạnh phúc, nếu ly đọc được dòng này, tớ chỉ muốn ly biết rằng, ly xinh lắm đấy ly có biết không",
        img: "tranly.jpg"
      },
      "ngockhanh": {
        text: `Chúc Khánh 20/10 thật vui vẻ, xinh đẹp và luôn rạng rỡ như bây giờ nhé 💐
Mong Khánh cùng “đồng đội chiến đấu” Dương My của mình tiếp tục là cặp song sát huyền thoại, đi tới đâu là tỏa sáng tới đó`,
        img: "ngockhanh.jpeg"
      }
    };

    const specialPass = "hocsinhthaytien"; // 🌟 mật khẩu đặc biệt
    const input = document.getElementById("passInput"),
      btn = document.getElementById("checkBtn"),
      box = document.getElementById("box"),
      canvas = document.getElementById("fireworksCanvas"),
      ctx = canvas.getContext("2d");
    let fireworks = [], running = false;

    function resizeCanvas() { canvas.width = innerWidth; canvas.height = innerHeight; }
    addEventListener("resize", resizeCanvas); resizeCanvas();

    function Firework(x, y, color) { this.x = x; this.y = innerHeight; this.targetY = y; this.color = color; this.speed = 7; this.exploded = false; this.p = []; }
    Firework.prototype.update = function () { if (!this.exploded) { this.y -= this.speed; if (this.y <= this.targetY) this.explode(); } this.p.forEach(p => p.update()); this.p = this.p.filter(p => p.a > 0); }
    Firework.prototype.draw = function () { if (!this.exploded) { ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, 2 * Math.PI); ctx.fillStyle = this.color; ctx.fill(); } this.p.forEach(p => p.draw()); }
    Firework.prototype.explode = function () { this.exploded = true; for (let i = 0; i < 80; i++)this.p.push(new Particle(this.x, this.y, this.color)); }
    function Particle(x, y, c) { this.x = x; this.y = y; const s = Math.random() * 4 + 2, a = Math.random() * Math.PI * 2; this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s; this.a = 1; this.c = c; }
    Particle.prototype.update = function () { this.x += this.vx; this.y += this.vy; this.vy += 0.05; this.a -= 0.02; }
    Particle.prototype.draw = function () { ctx.globalAlpha = this.a; ctx.beginPath(); ctx.fillStyle = this.c; ctx.arc(this.x, this.y, 2, 0, 2 * Math.PI); ctx.fill(); ctx.globalAlpha = 1; }

    function animate() {
      if (!running) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (Math.random() < 0.18) fireworks.push(new Firework(Math.random() * canvas.width, Math.random() * canvas.height / 2, `hsl(${Math.random() * 360},100%,65%)`));
      fireworks.forEach(f => { f.update(); f.draw(); });
      fireworks = fireworks.filter(f => f.p.length > 0 || !f.exploded);
      requestAnimationFrame(animate);
    }
    function startFireworks() { running = true; canvas.style.display = 'block'; animate(); }
    function stopFireworksSmooth() { running = false; canvas.style.opacity = '0'; setTimeout(() => { canvas.style.display = 'none'; ctx.clearRect(0, 0, canvas.width, canvas.height); }, 1200); }
    function createHearts() {
      let n = 0;
      const i = setInterval(() => {
        const h = document.createElement("div");
        h.className = "heart";
        h.style.left = Math.random() * 100 + "vw";
        h.textContent = ["💖", "💞", "💘", "💕"][Math.floor(Math.random() * 4)];
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 6000);
        if (++n > 20) clearInterval(i);
      }, 200);
    }

    btn.onclick = () => check();
    input.onkeypress = e => { if (e.key === "Enter") check(); };

    function check() {
      const val = input.value.trim();

      // 🔹 Nếu nhập mật khẩu đặc biệt → hiệu ứng pháo hoa + chuyển trang
      if (val === specialPass) {
        document.getElementById("celebration").textContent = "🎆 Học sinh thầy Tiến! 🎆";
        document.getElementById("celebration").classList.add("show");
        startFireworks();
        box.classList.add("dimmed");
        setTimeout(() => {
          stopFireworksSmooth();
          window.location.href = "home.html";
        }, 3000);
        return;
      }

      // 🔹 Còn lại: hiện lời chúc như bình thường
      if (!wishes[val]) {
        document.getElementById("result").innerHTML = "❌ Sai mật khẩu!";
        return;
      }

      const w = wishes[val];
      box.innerHTML = `<div class='wish-content' id='wishBox'><img src='${w.img}' class='wish-image'><p class='wish-text'>${w.text}</p></div>`;
      const wishBox = document.getElementById("wishBox");
      setTimeout(() => wishBox.classList.add("show"), 200);
      box.classList.add("dimmed");
      document.getElementById("celebration").classList.add("show");
      startFireworks();
      setTimeout(() => {
        stopFireworksSmooth();
        document.getElementById("celebration").style.opacity = "0";
        setTimeout(() => {
          box.classList.remove("dimmed");
          createHearts();
        }, 1200);
      }, 4000);
    }
  </script>
</body>

</html>
