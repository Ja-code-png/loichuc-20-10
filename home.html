<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💖 Video đặc biệt 20/10 💖</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #000;
  font-family: "Poppins", sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}
video {
  max-width: 90vw;
  max-height: 80vh;
  border-radius: 20px;
  box-shadow: 0 0 30px rgba(255,192,203,0.6);
  z-index: 0;
}
h1 {
  margin-top: 20px;
  color: #fff;
  font-size: 46px;
  text-shadow: 0 0 20px #ff80ab, 0 0 35px #e91e63;
  z-index: 2;
  animation: fade 2s ease forwards;
}
@keyframes fade {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}
button {
  background: rgba(255, 255, 255, 0.9);
  border: 2px solid #e91e63;
  color: #e91e63;
  padding: 10px 22px;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
  z-index: 3;
  margin-top: 10px;
  transition: 0.3s;
}
button:hover {
  background: #e91e63;
  color: #fff;
  transform: scale(1.05);
}
canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

/* 🔊 Nút bật tiếng */
#soundBtn {
  position: fixed;
  top: 20px;
  right: 25px;
  background: rgba(255,255,255,0.85);
  border: 2px solid #e91e63;
  border-radius: 50%;
  width: 55px;
  height: 55px;
  font-size: 22px;
  cursor: pointer;
  z-index: 5;
  transition: all 0.3s ease;
}
#soundBtn:hover {
  background: #e91e63;
  color: white;
  transform: scale(1.1);
}

/* 🎬 Nút điều khiển video */
#controlBtn {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: rgba(255,255,255,0.85);
  border: 2px solid #e91e63;
  border-radius: 50%;
  width: 55px;
  height: 55px;
  font-size: 22px;
  cursor: pointer;
  z-index: 5;
  transition: all 0.3s ease;
}
#controlBtn:hover {
  background: #e91e63;
  color: white;
  transform: scale(1.1);
}
</style>
</head>
<body>
  <video id="vid" autoplay muted playsinline>
    <source src="vid.mp4" type="video/mp4">
  </video>

  <h1>💖 Chúc mừng ngày 20/10 💖</h1>
  <canvas id="flowers"></canvas>

  <!-- <button onclick="location.href='message.html'">💌 Xem lại lời chúc</button> -->
  <button id="soundBtn">🔊</button>
  <button id="controlBtn">⏸</button>

<script>
// 🌸 Hiệu ứng hoa nở rộ
const canvas = document.getElementById("flowers");
const ctx = canvas.getContext("2d");
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
window.addEventListener("resize", resize);
resize();

const colors = ["#ffb6c1","#ff69b4","#f8bbd0","#ffc0cb","#ff80ab","#f48fb1","#e91e63"];
class Flower {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + 50;
    this.size = Math.random() * 20 + 10;
    this.growth = 0;
    this.speed = Math.random() * 0.8 + 0.4;
    this.opacity = 1;
    this.color = colors[Math.floor(Math.random() * colors.length)];
    this.angle = Math.random() * Math.PI * 2;
    this.rotateSpeed = Math.random() * 0.02 - 0.01;
  }
  update() {
    this.y -= this.speed;
    this.angle += this.rotateSpeed;
    this.growth += 0.5;
    if (this.growth > this.size) this.growth = this.size;
    this.opacity -= 0.002;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle);
    ctx.globalAlpha = this.opacity;
    for (let i = 0; i < 6; i++) {
      ctx.beginPath();
      ctx.rotate(Math.PI / 3);
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(this.growth / 2, -this.growth / 2, 0, -this.growth);
      ctx.quadraticCurveTo(-this.growth / 2, -this.growth / 2, 0, 0);
      ctx.fillStyle = this.color;
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(0, 0, this.growth * 0.15, 0, Math.PI * 2);
    ctx.fillStyle = "yellow";
    ctx.fill();
    ctx.restore();
  }
}
let flowers = [];
function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (Math.random() < 0.18) flowers.push(new Flower());
  flowers.forEach(f => { f.update(); f.draw(); });
  flowers = flowers.filter(f => f.opacity > 0);
  requestAnimationFrame(animate);
}
animate();

// 🔊 Nút bật/tắt âm thanh
const vid = document.getElementById("vid");
const soundBtn = document.getElementById("soundBtn");
soundBtn.onclick = () => {
  if (vid.muted) {
    vid.muted = false;
    vid.play();
    soundBtn.textContent = "🔈";
  } else {
    vid.muted = true;
    soundBtn.textContent = "🔊";
  }
};

// 🎬 Nút điều khiển video
const controlBtn = document.getElementById("controlBtn");
vid.addEventListener("ended", () => {
  controlBtn.textContent = "▶️"; // đổi nút khi video kết thúc
});
controlBtn.onclick = () => {
  if (vid.paused) {
    vid.play();
    controlBtn.textContent = "⏸";
  } else {
    vid.pause();
    controlBtn.textContent = "▶️";
  }
};
</script>
</body>
</html>
